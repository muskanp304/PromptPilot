{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2>Prompt Comparison Results</h2>

    <div class="row">

        <div class="col-md-4">

            <div class="card p-3">

                <h4>Beginner Prompt</h4>

                <p>{{ beginner_prompt }}</p>

                <hr>

                <p>{{ beginner_response }}</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3">

                <h4>Technical Prompt</h4>

                <p>{{ technical_prompt }}</p>

                <hr>

                <p>{{ technical_response }}</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3">

                <h4>Exam Prompt</h4>

                <p>{{ exam_prompt }}</p>

                <hr>

                <p>{{ exam_response }}</p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
