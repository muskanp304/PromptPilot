{% extends 'base.html' %}

{% block content %}

<div class="container glass-card p-5">

    <h2>📊 Prompt Analyzer</h2>

    <p>
        Compare how different prompts affect the output.
    </p>

    <form method="POST">

        <label>
            Enter Topic
        </label>

        <textarea
            name="topic"
            class="form-control"
            rows="4"
            required>
        </textarea>

        <br>

        <button class="btn btn-success">
            Compare Prompts
        </button>

    </form>

</div>

{% endblock %}
