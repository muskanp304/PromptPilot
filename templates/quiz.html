{% extends "base.html" %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass-card p-5">
                <h2 class="mb-4">🎯 Smart Quiz Generator</h2>

                <form id="quizForm" class="mb-5">

                    <label class="form-label fw-600">
                        Enter Topic
                    </label>

                    <input
                        type="text"
                        name="topic"
                        class="form-control"
                        required>

                    <br>

                    <button type="submit" class="btn btn-primary" id="generateBtn">
                        ✨ Generate Quiz
                    </button>

                </form>

                <div id="responseContainer" class="response-section" style="display: none;">
                    <hr class="my-4">
                    <h3 class="mb-4" style="color: #4d8eff;">💡 Generated Quiz</h3>
                    
                    <div class="response-card mb-4">
                        <h6 class="mb-3" style="color: #adc6ff; font-weight: 600;">✨ Quiz Questions</h6>
                        <div class="result-text" id="responseDisplay"></div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row gap-3 align-items-start mb-4">
                        <div class="d-flex gap-2 flex-wrap">
                            <button name="feedback" value="Yes" type="button" class="btn btn-success" onclick="submitFeedback('Yes')">👍 Helpful</button>
                            <button name="feedback" value="No" type="button" class="btn btn-danger" onclick="submitFeedback('No')">👎 Not Helpful</button>
                        </div>
                        <button type="button" class="btn btn-primary" id="downloadBtn">
                            📥 Download PDF
                        </button>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary" onclick="clearAndContinue()">
                            🔄 Generate Another Quiz
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('quizForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const topic = document.querySelector('input[name="topic"]').value;
    const btn = document.getElementById('generateBtn');

    btn.disabled = true;
    btn.textContent = '⏳ Generating...';

    try {
        const formData = new FormData();
        formData.append('topic', topic);

        const response = await fetch('/quiz', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            throw new Error('Failed to generate quiz');
        }

        const data = await response.json();

        document.getElementById('responseDisplay').textContent = data.response;
        document.getElementById('downloadBtn').onclick = () => downloadPDF(data.response);

        document.getElementById('responseContainer').style.display = 'block';
        document.getElementById('responseContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (error) {
        alert('Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '✨ Generate Quiz';
    }
});

function submitFeedback(value) {
    const feature = 'Quiz Generator';
    
    const formData = new FormData();
    formData.append('feature', feature);
    formData.append('feedback', value);

    fetch('/feedback', {
        method: 'POST',
        body: formData
    }).then(() => {
        alert('Thank you for your feedback!');
    }).catch(error => {
        alert('Error submitting feedback: ' + error.message);
    });
}

function downloadPDF(responseText) {
    const link = document.createElement('a');
    link.href = '{{ url_for("download") }}?response=' + encodeURIComponent(responseText);
    link.download = 'quiz.pdf';
    link.click();
}

function clearAndContinue() {
    document.querySelector('input[name="topic"]').value = '';
    document.getElementById('responseContainer').style.display = 'none';
    document.querySelector('input[name="topic"]').focus();
}
</script>

{% endblock %}
